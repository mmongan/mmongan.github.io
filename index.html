  <body>
    <canvas id="renderCanvas"></canvas>

    <div class="hud">
      <div class="button-row">
        <button id="settingsButton" class="icon-button" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-panel">
        <div class="settings-panel-header">
          <span>Settings</span>
          <button id="settingsCloseButton" class="settings-close-button">&times;</button>
        </div>

        <div class="settings-group">
          <label class="settings-label">XR mode</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="xrMode" value="immersive-vr" checked />
              <span>VR</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="xrMode" value="immersive-ar" />
              <span>AR</span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Floor</label>
          <label class="radio-option">
            <input id="sittingModeToggle" type="checkbox" />
            <span>Sitting mode (unchecked: Standing)</span>
          </label>
          <button id="fullScaleVRButton" class="xr-button secondary">Full scale VR</button>
          <button id="tabletopScaleButton" class="xr-button secondary">Tabletop scale</button>
          <button id="giantModeButton" class="xr-button secondary">Giant mode (fit room)</button>
          <label class="settings-label" for="roomWidth">Room width (meters)</label>
          <input id="roomWidth" type="number" min="1" max="50" step="0.1" value="4" required />
          <label class="settings-label" for="roomLength">Room length (meters)</label>
          <input id="roomLength" type="number" min="1" max="50" step="0.1" value="5" required />
          <label class="settings-label" for="floorHeight">Floor height (meters)</label>
          <input id="floorHeight" type="range" min="-2" max="2" step="0.01" value="0" />
          <output id="floorHeightValue" for="floorHeight">0.00 m</output>
          <label class="settings-label" for="tableHeight">Table height (meters)</label>
          <input id="tableHeight" type="range" min="0" max="2" step="0.01" value="1" />
          <output id="tableHeightValue" for="tableHeight">1.00 m</output>
          <label class="radio-option">
            <input type="checkbox" id="floorCalibrationToggle" />
            <span>Floor calibration</span>
          </label>
        </div>

        <div class="settings-group">
          <label class="settings-label">Field markings</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="highschool" checked />
              <span>High School</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="college" />
              <span>College</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="nfl" />
              <span>NFL</span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label" for="videoScreenSize">Video screen size</label>
          <div class="radio-row">
            <input id="videoScreenSize" type="range" min="50" max="175" step="5" value="100" />
            <output id="videoScreenSizeValue" for="videoScreenSize">100%</output>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Robot paths</label>
          <label class="radio-option">
            <input type="checkbox" id="showAllPathsToggle" />
            <span>Show all paths</span>
          </label>
          <label class="radio-option">
            <input type="checkbox" id="collisionMarkersToggle" checked />
            <span>Show collision markers</span>
          </label>
          <label class="radio-option">
            <input type="checkbox" id="placementModeToggle" />
            <span>Placement mode (trigger places a standing robot)</span>
          </label>
          <label class="settings-label" for="marcherCount">Marchers to add</label>
          <div class="radio-row">
            <input id="marcherCount" type="range" min="1" max="100" step="1" value="8" />
            <output id="marcherCountValue" for="marcherCount">8</output>
          </div>
          <button id="addRandomRobotsButton" class="xr-button secondary">Add marchers</button>
          <button id="generateDrillButton" class="xr-button secondary">Generate marching band drill</button>
        </div>
      </div>
    </div>
