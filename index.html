  <body>
    <canvas id="renderCanvas"></canvas>

    <div class="hud">
      <div class="button-row">
        <button id="settingsButton" class="icon-button" aria-label="Settings" title="Settings">⚙</button>
      </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-panel">
        <div class="settings-panel-header">
          <span>Settings</span>
          <button id="settingsCloseButton" class="settings-close-button">&times;</button>
        </div>

        <div class="settings-group">
          <label class="settings-label">XR mode</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="xrMode" value="immersive-vr" checked />
              <span>VR</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="xrMode" value="immersive-ar" />
              <span>AR</span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Floor</label>
          <label class="radio-option">
            <input id="sittingModeToggle" type="checkbox" />
            <span>Sitting mode (unchecked: Standing)</span>
          </label>
          <button id="fullScaleVRButton" class="xr-button secondary">Full scale VR</button>
          <button id="tabletopScaleButton" class="xr-button secondary">Tabletop scale</button>
          <button id="giantModeButton" class="xr-button secondary">Giant mode (fit room)</button>
          <label class="settings-label" for="roomWidth">Room width (meters)</label>
          <input id="roomWidth" type="number" min="1" max="50" step="0.1" value="4" required />
          <label class="settings-label" for="roomLength">Room length (meters)</label>
          <input id="roomLength" type="number" min="1" max="50" step="0.1" value="5" required />
          <label class="settings-label" for="floorHeight">Floor height (meters)</label>
          <input id="floorHeight" type="range" min="-2" max="2" step="0.01" value="0" />
          <output id="floorHeightValue" for="floorHeight">0.00 m</output>
          <label class="settings-label" for="tableHeight">Table height (meters)</label>
          <input id="tableHeight" type="range" min="0" max="2" step="0.01" value="1" />
          <output id="tableHeightValue" for="tableHeight">1.00 m</output>
          <label class="radio-option">
            <input type="checkbox" id="floorCalibrationToggle" />
            <span>Floor calibration</span>
          </label>
        </div>

        <div class="settings-group">
          <label class="settings-label">Field markings</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="highschool" checked />
              <span>High School</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="college" />
              <span>College</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="nfl" />
              <span>NFL</span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label" for="videoScreenSize">Video screen size</label>
          <div class="radio-row">
            <input id="videoScreenSize" type="range" min="50" max="175" step="5" value="100" />
            <output id="videoScreenSizeValue" for="videoScreenSize">100%</output>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Robot paths</label>
          <label class="radio-option">
            <input type="checkbox" id="showAllPathsToggle" />
            <span>Show all paths</span>
          </label>
          <label class="radio-option">
            <input type="checkbox" id="collisionMarkersToggle" checked />
            <span>Show collision markers</span>
          </label>
          <label class="radio-option">
            <input type="checkbox" id="placementModeToggle" />
            <span>Placement mode (trigger places a standing robot)</span>
          </label>
          <label class="radio-option">
            <input type="checkbox" id="eraseModeToggle" />
            <span>Erase marchers (click, trigger, pinch, or touch a marcher)</span>
          </label>
          <div class="radio-row">
            <button id="undoEraseButton" disabled>Undo erase</button>
            <button id="redoEraseButton" disabled>Redo erase</button>
          </div>
          <label class="radio-option">
            <input type="checkbox" id="drillChartPadToggle" />
            <span>Drill chart pad (floating, grabbable; one page per 8-count set)</span>
          </label>
          <label class="settings-label">Instrument (selected marcher and new marchers)</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="trumpet" checked />
              <span>Trumpet</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="mellophone" />
              <span>Mellophone</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="altoSax" />
              <span>Alto saxophone</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="bariSax" />
              <span>Baritone saxophone</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="trombone" />
              <span>Trombone</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="euphonium" />
              <span>Euphonium</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="clarinet" />
              <span>Clarinet</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="flute" />
              <span>Flute</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="sousaphone" />
              <span>Sousaphone</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="snare" />
              <span>Snare drum</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="tenors" />
              <span>Tenor drums</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="bassDrum" />
              <span>Bass drum</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="marcherInstrument" value="glockenspiel" />
              <span>Glockenspiel</span>
            </label>
          </div>
          <label class="settings-label" for="marcherCount">Marchers to add</label>
          <div class="radio-row">
            <input id="marcherCount" type="range" min="1" max="100" step="1" value="8" />
            <output id="marcherCountValue" for="marcherCount">8</output>
          </div>
          <button id="addRandomRobotsButton" class="xr-button secondary">Add marchers</button>
          <button id="generateDrillButton" class="xr-button secondary">Generate marching band drill</button>
          <label class="settings-label" for="openMarchUrl">Open OpenMarch show (.dots URL)</label>
          <form id="openMarchForm" class="url-row">
            <input id="openMarchUrl" type="url" placeholder="https://example.com/show.dots" autocomplete="url" spellcheck="false" required />
            <button id="openMarchButton" type="submit" class="xr-button secondary">Open</button>
          </form>
          <button id="openMarchExampleButton" type="button" class="xr-button secondary">Load example OpenMarch show</button>
          <output id="openMarchStatus" class="settings-status" for="openMarchUrl"></output>
          <label class="radio-option">
            <input type="checkbox" id="drillLabelsToggle" />
            <span>Show drill labels above marchers</span>
          </label>
          <details id="showInfo" class="show-info" hidden>
            <summary id="showInfoSummary">Show</summary>
            <p class="show-info-heading">Pages (click to jump)</p>
            <div class="show-info-table">
              <table>
                <thead><tr><th>Page</th><th>Count</th><th>Counts</th><th>Notes</th></tr></thead>
                <tbody id="showInfoPages"></tbody>
              </table>
            </div>
            <p class="show-info-heading">Marchers</p>
            <div class="show-info-table">
              <table>
                <thead><tr><th>Label</th><th>Name</th><th>Section</th><th>Instrument</th></tr></thead>
                <tbody id="showInfoMarchers"></tbody>
              </table>
            </div>
          </details>
        </div>
      </div>
    </div>
