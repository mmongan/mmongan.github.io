<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Permissions-Policy"
      content="xr-spatial-tracking=(*)"
    />
    <title>Babylon.js WebXR AR</title>
    <style>
      /* Fill the full viewport with no scroll bars */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }

      #render-canvas {
        width: 100%;
        height: 100%;
        touch-action: none; /* prevent scroll-hijack on touch devices */
        display: block;
      }

      /* ── AR overlay UI ──────────────────────────────────────────────── */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: env(safe-area-inset-bottom, 24px);
        gap: 12px;
      }

      #status {
        pointer-events: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.85rem;
        padding: 6px 14px;
        border-radius: 20px;
        backdrop-filter: blur(6px);
        max-width: 90vw;
        text-align: center;
      }

      #build-info {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 9999;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 0.8rem;
        padding: 6px 10px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
      }

    </style>
    <script type="module" crossorigin src="/assets/index-CTQ6GsWQ.js"></script>
  </head>
  <body>
    <canvas id="render-canvas"></canvas>
    <div id="build-info">Loading build…</div>

    <div id="overlay">
      <span id="status">Initialising…</span>
    </div>

  </body>
</html>
