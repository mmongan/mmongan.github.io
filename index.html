<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Babylon.js WebXR VR and AR demo for Meta Quest 3"
    />
    <title>Chartxr</title>
    <script type="module" crossorigin src="/assets/index-DkJHRiun.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CCqY_1Xb.css">
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div class="hud">
      <div class="button-row">
        <button id="settingsButton" class="xr-button secondary">Settings</button>
      </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-panel">
        <div class="settings-panel-header">
          <span>Settings</span>
          <button id="settingsCloseButton" class="settings-close-button">&times;</button>
        </div>

        <div class="settings-group">
          <label class="settings-label">XR mode</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="xrMode" value="immersive-vr" checked />
              <span>VR</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="xrMode" value="immersive-ar" />
              <span>AR</span>
            </label>
          </div>
        </div>

        <div class="settings-group">
          <label class="settings-label">Field markings</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="highschool" checked />
              <span>High School</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="college" />
              <span>College</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="fieldLevel" value="nfl" />
              <span>NFL</span>
            </label>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
