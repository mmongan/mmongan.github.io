<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Babylon.js WebXR VR and AR demo for Meta Quest 3"
    />
    <title>Chartxr</title>
    <script type="module" crossorigin src="/assets/index-DEAmNCYz.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Do5yqIvg.css">
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div class="hud">
      <div class="button-row">
        <button id="vrButton" class="xr-button">Enter VR</button>
        <button id="arButton" class="xr-button secondary">Enter AR</button>
        <button id="settingsButton" class="xr-button secondary">Settings</button>
      </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
      <div class="settings-panel">
        <div class="settings-panel-header">
          <span>Settings</span>
          <button id="settingsCloseButton" class="settings-close-button">&times;</button>
        </div>
        <div class="field-level-row">
          <label for="fieldLevelSelect">Field markings:</label>
          <select id="fieldLevelSelect">
            <option value="highschool" selected>High School</option>
            <option value="college">College</option>
            <option value="nfl">NFL</option>
          </select>
        </div>
      </div>
    </div>

  </body>
</html>
