<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Permissions-Policy"
      content="xr-spatial-tracking=(*)"
    />
    <title>Babylon.js WebXR AR</title>
    <style>
      /* Fill the full viewport with no scroll bars */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }

      #render-canvas {
        width: 100%;
        height: 100%;
        touch-action: none; /* prevent scroll-hijack on touch devices */
        display: block;
      }

      /* ── AR overlay UI ──────────────────────────────────────────────── */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: env(safe-area-inset-bottom, 24px);
        gap: 12px;
      }

      #status {
        pointer-events: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.85rem;
        padding: 6px 14px;
        border-radius: 20px;
        backdrop-filter: blur(6px);
        max-width: 90vw;
        text-align: center;
      }

      #enter-ar-btn {
        pointer-events: auto;
        background: #6c63ff;
        color: #fff;
        border: none;
        padding: 14px 32px;
        border-radius: 32px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(108, 99, 255, 0.5);
        transition: background 0.2s, transform 0.1s;
      }

      #enter-ar-btn:active {
        transform: scale(0.97);
        background: #5549e8;
      }

      #enter-ar-btn:disabled {
        background: #555;
        box-shadow: none;
        cursor: not-allowed;
      }

    </style>
    <script type="module" crossorigin src="/assets/index-B-JbLMH-.js"></script>
  </head>
  <body>
    <canvas id="render-canvas"></canvas>

    <!-- Minimal AR overlay: status label + Enter AR button -->
    <div id="overlay">
      <span id="status">Initialising…</span>
      <button id="enter-ar-btn" disabled>Enter AR</button>
    </div>

  </body>
</html>
