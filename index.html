<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Babylon.js WebXR VR and AR demo for Meta Quest 3"
    />
    <title>Babylon.js Quest 3 VR/AR</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>

    <div class="hud">
      <div class="title-panel">
        <h1>Quest 3 WebXR</h1>
        <p>Babylon.js VR / AR demo</p>
      </div>

      <div class="button-row">
        <button id="vrButton" class="xr-button">Enter VR</button>
        <button id="arButton" class="xr-button secondary">Enter AR</button>
      </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="app.js"></script>
  </body>
</html>
