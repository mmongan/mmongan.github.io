<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Permissions-Policy"
      content="xr-spatial-tracking=(*)"
    />
    <title>ChartXR</title>
    <style>
      /* Fill the full viewport with no scroll bars */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07130d;
        font-family: Georgia, "Times New Roman", serif;
      }

      #render-canvas {
        width: 100%;
        height: 100%;
        touch-action: none; /* prevent scroll-hijack on touch devices */
        display: block;
      }

      /* ── AR overlay UI ──────────────────────────────────────────────── */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: env(safe-area-inset-bottom, 24px);
        gap: 12px;
      }

      #xr-button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      #music-panel {
        pointer-events: auto;
        display: none !important;
        grid-template-columns: auto auto auto auto minmax(120px, 260px);
        align-items: center;
        gap: 8px;
        width: min(94vw, 760px);
        padding: 10px;
        border: 1px solid rgba(245, 240, 223, 0.35);
        border-radius: 6px;
        background: rgba(7, 19, 13, 0.88);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
      }

      #music-panel button,
      #music-panel label {
        min-height: 36px;
        border: 0;
        border-radius: 4px;
        padding: 8px 12px;
        background: #f5f0df;
        color: #07130d;
        font: 700 0.85rem Georgia, "Times New Roman", serif;
        cursor: pointer;
        text-align: center;
      }

      #music-panel button:disabled {
        cursor: default;
        opacity: 0.45;
      }

      #music-position {
        width: 100%;
        accent-color: #c92532;
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      #status {
        display: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.85rem;
        padding: 6px 14px;
        border-radius: 6px;
        backdrop-filter: blur(6px);
        max-width: 90vw;
        text-align: center;
      }

      .xr-button {
        pointer-events: auto;
        border: none;
        border-radius: 4px;
        padding: 10px 16px;
        font-size: 1rem;
        font-weight: 600;
        color: #07111f;
        background: #f5f0df;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      }

      .xr-button:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      #build-info {
        display: none;
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 9999;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 0.8rem;
        padding: 6px 10px;
        border-radius: 4px;
        backdrop-filter: blur(6px);
      }

      #controller-palette {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: none;
        flex-wrap: wrap;
        gap: 10px;
        max-width: min(92vw, 620px);
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(7, 17, 31, 0.9);
        border: 1px solid rgba(114, 240, 255, 0.35);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        z-index: 10000;
        pointer-events: auto;
      }

      #controller-palette.visible {
        display: flex;
      }

      .palette-button {
        border: none;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #07111f;
        background: linear-gradient(135deg, #72f0ff, #7cffb4);
        cursor: pointer;
      }

      .palette-button.active {
        outline: 2px solid #fff;
        background: linear-gradient(135deg, #7cffb4, #72f0ff);
      }

      @media (max-width: 620px) {
        #music-panel {
          grid-template-columns: repeat(4, 1fr);
        }

        #music-position {
          grid-column: 1 / -1;
        }
      }

    </style>
    <script type="module" crossorigin src="/assets/field-dJeh_Rqs.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/package-B5Eo_0zM.js">
  </head>
  <body>
    <canvas id="render-canvas"></canvas>
    <div id="build-info">Loading field…</div>

    <div id="overlay">
      <div id="music-panel" aria-label="MIDI transport">
        <label for="midi-file">Load MIDI</label>
        <input id="midi-file" class="file-input" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" />
        <label for="drill-file">Load Drill</label>
        <input id="drill-file" class="file-input" type="file" accept=".shw,.viewer,.json,application/json" />
        <button id="play-button" type="button" disabled>Play</button>
        <button id="stop-button" type="button" disabled>Stop</button>
        <input id="music-position" type="range" min="0" max="1" step="0.001" value="0" aria-label="Music position" disabled />
      </div>
      <div id="xr-button-row">
        <button id="enter-ar-button" class="xr-button" type="button">Enter Field AR</button>
        <button id="enter-vr-button" class="xr-button" type="button">Enter Stadium VR</button>
      </div>
      <span id="status">Preparing the field…</span>
    </div>

  </body>
</html>
